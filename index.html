<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <style>
        .btn{
            background-color: rgb(209, 191, 194);
        }
        .todo{
            margin: 10px 0 0;
        }
        .inProgress{
            margin: 10px 0 0;
        }
        .done{
            margin: 10px 0 0;
        }
    </style>
    <header class="bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between">
        <h1 class="h3 fw-bold mb-0">FlowBoard</h1>
        
       <button id="btn-new" class="btn btn-primary rounded-pill px-4">+ Nouvelle carte</button>

    </header>

    <div id="cards" class="container mt-4"></div>

    <div class="modal" id="modale" style="background: rgba(0,0,0,.5);">
        <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 border-0 shadow">

            <input type="text" id="assignee" class="form-control mb-1" placeholder="entrer le nom ">
            <div class="errnom text-danger small mb-3"></div>

            <input type="text" id="title" class="form-control mb-1" placeholder="description ">
            <div class="errDesc text-danger small mb-3"></div>

            <select id="status" class="form-select mb-1">
                <option value="" hidden>status</option>
                <option value="todo">todo</option>
                <option value="in-progress">in-progress</option>
                <option value="done">done</option>
            </select>
            <div class="errStatus text-danger small mb-3"></div>

            <select id="Priority" class="form-select mb-1">
                <option value="" hidden>Priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <div class="errPriopity text-danger small mb-3"></div>

            <div class="d-flex justify-content-between mt-3">

                <button class="next btn btn-primary rounded-pill px-4">suivants</button>
            </div>

        </div>
        </div>
    </div>
        


    <!-- filtrage -->
        <section class="bg-white border-bottom px-4 py-3">
            <div class="row g-2">
                <div class="col-12 col-md-4">
                    <input type="text" id="search" class="form-control" placeholder="title">
                </div>
                 
                 <div class="col-12 col-md-4">
                    <select id="filter" class="form-control">
                         <option value="" > All Priorities</option>
                         <option value="low">Low</option>
                         <option value="medium">Medium</option>
                         <option value="high">High</option>
                    </select>
                </div>
            </div>

            <div id="error" class="alert alert-danger d-flex align-items-center justify-content-between d-none mx-4 mt-3">
                <span>Impossible de charger les cartes. Vérifiez votre connexion.</span>
                <button id="tryAgain" class="btn btn-sm">Réessayer</button>
            </div>


        <main id="cards" class="row g-4">
            <!-- 1er partie -->
            <div class="col-12 col-md-4">
                <section id="todo">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h2 class="h5 fw-semibold mb-0 d-flex align-items-center gap-2">
                            <span class="badge rounded-pill text-bg-light border"></span>To Do
                        </h2>
                        <span id="todoNum" class="badge rounded-pill text-bg-light border">0</span>
                    </div>
                    <div id="todo" class="d-grid gap-3">
                        <span class="badge rounded-pill text-danger bg-danger-subtle px-3 py-1 fw-medium" style="font-size: 0.8rem;"></span>
                        <p class="fw-semibold text-dark mb-3" style="font-size: 1.05rem;"></p>
                        <div class="d-flex align-items-center gap-2">
                    </div>
                </section>
            </div>
            <!-- 2eme partie -->
            <div class="col-12 col-md-4">
                <section id="inProgress">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h2 class="h5 fw-semibold mb-0 d-flex align-items-center gap-2">
                            <span class="badge rounded-pill text-bg-light border"></span>In progress
                        </h2>
                        <span id="progNum" class="badge rounded-pill text-bg-light border">0</span>
                    </div>
                    <div id="progress" class="d-grid gap-3"></div>
                </section>
            </div>
            <!-- 3eme partie -->
            <div class="col-12 col-md-4">
                <section id="done">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h2 class="h5 fw-semibold mb-0 d-flex align-items-center gap-2">
                            <span class="badge rounded-pill text-bg-light border"></span>Done
                        </h2>
                        <span id="doneNum" class="badge rounded-pill text-bg-light border">0</span>
                    </div>
                    <div id="done" class="d-grid gap-3"></div>
                </section>
            </div>
        </main>


    <!-- <script src="api.js" type="module"></script> -->
    <script src="ui.js" type="module"></script>
    

</body>
</html>
